game_slug: sp-football-life-2027
name: "SP Football Life 2027"
year: 2026
user: eskay993
runner: wine
slug: sp-football-life-2027-win
version: Windows
description: Installer for Football Life 2027 by SmokePatch. Download the game from pessmokepatch.com.
notes:
script:
  variables:
    VERSION: 27
  files:
  - setup: N/A:SPFL${VERSION}_setup.exe
  game:
    exe: $GAMEDIR/drive_c/Program Files (x86)/SP Football Life 20${VERSION}/FL_20${VERSION} start.exe
    working_dir: $GAMEDIR/drive_c/Program Files (x86)/SP Football Life 20${VERSION}
    prefix: $GAMEDIR
    launch_configs:
    - exe: $GAMEDIR/drive_c/Program Files (x86)/SP Football Life 20${VERSION}/Settings.exe
      name: Display and Controller Settings
    - exe: $GAMEDIR/drive_c/Program Files (x86)/SP Football Life 20${VERSION}/FL${VERSION} switcher.exe
      name: Gameplay Switcher
    prefix: $GAMEDIR
  installer:
  - task:
      description: Creating prefix...
      name: create_prefix
      prefix: $GAMEDIR
  - task:
      description: Installing Microsoft .NET Framework 4.8 (this can take a while)...
      app: dotnet48
      name: winetricks
      prefix: $GAMEDIR
      env:
        PROTON_USE_XALIA: "0"
  - task:
      description: Installing Microsoft .NET Framework 8.0...
      app: dotnet8
      name: winetricks
      prefix: $GAMEDIR
      env:
        PROTON_USE_XALIA: "0"
  - task:
      description: Installing other requirements...
      app: vcrun2022 unifont win10
      name: winetricks
      prefix: $GAMEDIR
  - task:
      description: Starting game installer...
      executable: $setup
      name: wineexec
      prefix: $GAMEDIR
  - execute:
      description: Checking game files...
      command: |
        gamedir="$GAMEDIR/drive_c/Program Files (x86)/SP Football Life 20${VERSION}"
        if [ ! -d "$gamedir" ]; then
          echo "ERROR: Game folder not found: $gamedir"
          echo "Please re-run the install and keep the default install folder in the SPFL setup."
          exit 1
        fi
        cd "$gamedir"
        # Launcher: SmokePatch has used both "FL_20XX start.exe" and "FL 20XX start.exe" over the years.
        # Link whichever one the setup installed to the name the Lutris config expects.
        if [ ! -e "FL_20${VERSION} start.exe" ]; then
          found=$(find . -maxdepth 1 -iname "*start*.exe" | head -n1)
          if [ -n "$found" ]; then
            ln -sv "$(basename "$found")" "FL_20${VERSION} start.exe"
          else
            echo "ERROR: Could not find the FL launcher (*start*.exe) in $gamedir"
            exit 1
          fi
        fi
        # Switcher: same idea, so the "Gameplay Switcher" menu option keeps working.
        if [ ! -e "FL${VERSION} switcher.exe" ]; then
          found=$(find . -maxdepth 1 -iname "*switcher*.exe" | head -n1)
          if [ -n "$found" ]; then
            ln -sv "$(basename "$found")" "FL${VERSION} switcher.exe"
          else
            echo "WARNING: Could not find the gameplay switcher (*switcher*.exe). Skipping."
          fi
        fi
  - execute:
      description: Renaming dlls...
      command: |
        cd "$GAMEDIR/drive_c/Program Files (x86)/SP Football Life 20${VERSION}"
        if [ -f "xinput1_3.dll" ]; then
          cp -v "xinput1_3.dll" "xinput1_3.dll.bak"
          mv -v "xinput1_3.dll" "ddraw.dll"
        else
          echo "xinput1_3.dll not found. Skipping."
        fi
  - task:
      description: Running gameplay switcher...
      executable: $GAMEDIR/drive_c/Program Files (x86)/SP Football Life 20${VERSION}/FL${VERSION} switcher.exe
      name: wineexec
      prefix: $GAMEDIR
  - execute:
      description: Setting up aspect ratio fix...
      command: |
        mkdir -p "$GAMEDIR/drive_c/Program Files (x86)/SP Football Life 20${VERSION}/SiderAddons/modules"
        ratio=$(awk -v w="$RESOLUTION_WIDTH" -v h="$RESOLUTION_HEIGHT" 'BEGIN { printf "%.4f", w / h }')
        if [ "$ratio" != "1.7778" ] && [ "$ratio" != "0.5625" ]; then
          cd "$GAMEDIR/drive_c/Program Files (x86)/SP Football Life 20${VERSION}/SiderAddons"
          if [ -f sider.ini ]; then
            cp sider.ini sider.ini.bak
            match=$(grep "lua.module =" sider.ini | tail -n1)
            sed -i -e "/$match/ s/\(.*\)\(lua.module.*\)/\1\2\n\1lua.module = \"aspectratio.lua\"/" sider.ini
          else
            echo "sider.ini not found. Skipping aspect ratio fix."
          fi
        fi
  - write_file:
      description: Writting aspectratio.lua...
      file: $GAMEDIR/drive_c/Program Files (x86)/SP Football Life 20${VERSION}/SiderAddons/modules/aspectratio.lua
      content: |
        -- Based on lua by Durandil67

        local m = { version = "1.0" }

        function m.init(ctx)
            local addr = memory.search_process("\x80\x7B\x7C\x00\x0F\x28")
            if addr then
                log(string.format("found magic string at: %s", memory.hex(addr)))
                memory.write(addr, "\x80\x7B\x7C\x01\x0F\x28")
            else
                error("unable to find magic string")
            end
        end

        return m
  - write_file:
      description: Writting bat file...
      file: $GAMEDIR/drive_c/Program Files (x86)/SP Football Life 20${VERSION}/FL_20${VERSION}.bat
      content: |
        @echo off

        set "fl=FL_2027.exe"
        set "sider=SiderAddons\sider.exe"
        set "log=SiderAddons\sider-app.log"

        cd /d "%~dp0"
        del %log%
        echo Launching sider...
        start "" %sider%

        :wait
        if not exist "%log%" (
            ping -n 1 127.0.0.1 >nul
            goto wait
        )

        ping -n 3 127.0.0.1 >nul
        echo sider active...
        echo Launching FL...
        start "" %fl%
  - execute:
      description: Checking game exe name in bat file...
      command: |
        cd "$GAMEDIR/drive_c/Program Files (x86)/SP Football Life 20${VERSION}"
        if [ ! -f "FL_20${VERSION}.exe" ]; then
          found=$(find . -maxdepth 1 -iname "FL*20${VERSION}.exe" ! -iname "*start*" | head -n1)
          if [ -n "$found" ]; then
            sed -i -e "s/^set \"fl=.*\"/set \"fl=$(basename "$found")\"/" "FL_20${VERSION}.bat"
            echo "Bat file now launches $(basename "$found")"
          else
            echo "WARNING: Game exe not found. Edit FL_20${VERSION}.bat manually if you use it."
          fi
        fi
  system:
    env:
      ENABLE_GAMESCOPE_WSI: "0"
      PROTON_USE_XALIA: "0"
  wine:
    dxvk: true
    overrides:
      steam_api64: n,b
      ddraw: n,b
      lsteamclient: d
